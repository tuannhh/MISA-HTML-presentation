# MISA Presentation — reverse proxy Nginx đặt trước ứng dụng (container `app`, cổng 3000).
# Dùng với docker compose:  docker compose --profile proxy up -d   (xem memory-bank/07-deployment-infrastructure.md)
# Dùng với Nginx cài trên máy chủ: chép khối `upstream` + `server`, đổi máy chủ upstream thành 127.0.0.1:<APP_PORT>.
#
# Bắt buộc phía ứng dụng khi đặt sau proxy: TRUST_PROXY=1 (2 nếu còn 1 lớp TLS/LB phía trước Nginx này),
# APP_BASE_URL = địa chỉ người dùng truy cập; chạy HTTPS thì thêm SESSION_COOKIE_SECURE=true.

# Giữ X-Forwarded-Proto của lớp phía trước (LB/TLS) nếu có; không có thì lấy scheme của chính Nginx.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

# Phân giải lại tên `app` qua DNS nội bộ Docker: build lại/tạo lại container app có thể đổi IP,
# nếu chỉ phân giải 1 lần lúc Nginx khởi động thì proxy trả 502 tới khi restart Nginx. (`resolve` có từ Nginx 1.27.3.)
# Nginx cài trên máy chủ: bỏ `resolver`, `zone`, `resolve` và dùng server 127.0.0.1:<APP_PORT>.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream misa_presentation_app {
  zone misa_presentation_app 64k;
  server app:3000 resolve;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  # Tổng tư liệu tải lên tối đa 300 MB (MAX_UPLOAD_MB) + ~10 MB cho ranh giới multipart và các trường văn bản.
  # Đổi MAX_UPLOAD_MB thì đổi số này theo (MAX_UPLOAD_MB + 10).
  client_max_body_size 310m;
  # Chuyển luồng upload thẳng tới ứng dụng thay vì ghi tạm toàn bộ ra đĩa Nginx:
  # app chặn sớm khi vượt hạn mức (đọc Content-Length) và % tải lên trên giao diện phản ánh đúng tiến trình thật.
  proxy_request_buffering off;
  # Mạng chậm: khoảng nghỉ tối đa giữa 2 lần nhận dữ liệu (không phải tổng thời gian tải).
  client_body_timeout 300s;

  # Tạo bài là job nền (trả 202 ngay); xuất PDF bài dài có thể mất vài phút (server.requestTimeout = 10 phút).
  proxy_connect_timeout 10s;
  proxy_send_timeout 600s;
  proxy_read_timeout 600s;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  # $http_host giữ cả cổng: app so khớp Origin với protocol://host khi kiểm tra CSRF và dựng CSP trang xem trước.
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $fwd_proto;

  # Nén phản hồi văn bản (JS/CSS/JSON/HTML xuất bài). Ảnh WebP/PDF đã nén sẵn.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

  # Lớp chặn IP thứ 2 (tuỳ chọn) — ứng dụng đã chặn theo IP_ALLOWLIST. Nếu dùng ở đây, giữ khớp danh sách với IP_ALLOWLIST.
  # Nginx đứng sau LB/TLS khác: cần real_ip (set_real_ip_from <IP LB>; real_ip_header X-Forwarded-For;) để $remote_addr là IP người dùng.
  # allow 203.0.113.0/24;
  # deny all;

  location / {
    proxy_pass http://misa_presentation_app;
  }

  # Kiểm tra sống của chính proxy (không đi qua app).
  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
