# MISA Presentation — triển khai 1 máy chủ: MySQL 8.4 + ứng dụng Node (kèm Chromium).
# Chạy: cp .env.example .env (điền giá trị) → docker compose up -d --build → tạo admin (xem README).
name: misa-presentation

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Thiếu MYSQL_ROOT_PASSWORD trong .env}
      MYSQL_DATABASE: ${DB_NAME:-misa_presentation}
      MYSQL_USER: ${DB_USER:-misa_presentation}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD trong .env}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--max-allowed-packet=64M"]
    volumes:
      - mysql-data:/var/lib/mysql
      # Áp baseline ở lần khởi tạo volume đầu tiên. Thay đổi sau đó: chạy changelog thủ công.
      - ./startup/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    image: misa-presentation:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      STORAGE_DIR: /data/storage
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:3000"
    volumes:
      - app-data:/data
    shm_size: "512mb"

  # Reverse proxy Nginx (tuỳ chọn): docker compose --profile proxy up -d
  # Cho phép request 310 MB (tổng tư liệu 300 MB), chuyển luồng upload thẳng tới app, timeout đủ cho xuất PDF.
  # Khi bật: đặt TRUST_PROXY=1 và APP_BASE_URL = địa chỉ qua proxy trong .env (xem deploy/nginx/default.conf).
  proxy:
    image: nginx:1.28-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-80}:80"
    volumes:
      # Mount cả thư mục (không mount 1 tệp): sửa tệp cấu hình xong chỉ cần `nginx -s reload`.
      - ./deploy/nginx:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mysql-data:
  app-data:
